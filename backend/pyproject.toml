[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-feedback-agent-backend"
version = "0.1.0"
description = "Product feedback API and analysis workers"
requires-python = ">=3.12,<3.15"
dependencies = [
  "anyio==4.12.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "hindsight-client==0.10.1",
  "pydantic==2.13.5",
  "pymongo==4.18.2",
  "starlette==0.49.3",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
